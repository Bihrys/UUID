name: Build all Minecraft versions

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  fabric:
    name: Fabric (all versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all Fabric modules
        run: ./gradlew buildAll --continue --stacktrace

      - name: Upload Fabric jars
        uses: actions/upload-artifact@v4
        with:
          name: fabric-jars
          path: |
            fabric-*/build/libs/*.jar
            !fabric-*/build/libs/*-sources.jar
          retention-days: 30

  forge:
    name: Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Forge 1.20.1
        working-directory: forge-1.20.1
        run: ./gradlew build --stacktrace

      - name: Upload Forge jar
        uses: actions/upload-artifact@v4
        with:
          name: forge-jars
          path: |
            forge-1.20.1/build/libs/*.jar
            !forge-1.20.1/build/libs/*-sources.jar
          retention-days: 30

  prerelease:
    name: Rolling prerelease
    if: github.event_name != 'pull_request'
    needs: [ fabric, forge ]
    runs-on: ubuntu-latest
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          pattern: '*-jars'
          path: jars

      - name: Update automated-build prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: automated-build
          name: Automated build
          prerelease: true
          files: jars/**/*.jar
